name: gitleaks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - name: Install gitleaks v8.30.1 (checksum verified)
        env:
          V: 8.30.1
        run: |
          set -euo pipefail
          base=https://github.com/gitleaks/gitleaks/releases/download/v${V}
          f=gitleaks_${V}_linux_x64.tar.gz
          curl -sSfLO "$base/$f"
          curl -sSfL "$base/gitleaks_${V}_checksums.txt" | grep " $f\$" | sha256sum -c -
          tar -xzf "$f" gitleaks
      - name: Scan (redacted report)
        run: ./gitleaks git --redact --no-banner --exit-code 1 --report-format json --report-path gitleaks-report.json .
      - name: Upload redacted report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          retention-days: 7
          if-no-files-found: ignore
