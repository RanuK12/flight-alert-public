    name: flight-alert-public
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        sync: false
      - key: PORT
        sync: false
      - key: LOG_LEVEL
        sync: false
      - key: TZ
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: PUBLIC_KILL_SWITCH
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: TELEGRAM_POLLING
        sync: false
      - key: FEATURE_SEARCH
        sync: false
      - key: FEATURE_ALERTS
        sync: false
      - key: FEATURE_PAYMENTS_STARS
        sync: false
      - key: FEATURE_PAYMENTS_MP
        sync: false
      - key: FEATURE_PAYMENTS_STRIPE
        sync: false
      - key: FEATURE_CHANNELS
        sync: false
      - key: FEATURE_INSTANT_ALERTS
        sync: false
      - key: PRO_SEARCH_PER_MIN
        sync: false
      - key: PRO_SEARCH_PER_DAY
        sync: false
