        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_WEBHOOK_SECRET_LIVE
        sync: false
      - key: PAYMENTS_MODE
        sync: false
      - key: STRIPE_PRICE_USD
